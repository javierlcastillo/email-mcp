services:
  - type: web
    name: mailmcp
    runtime: python
    buildCommand: pip install uv && uv sync
    startCommand: uv run main.py
    envVars:
      - key: MCP_AUTH_TOKEN
        sync: false
      - key: PERSONAL_USER
        sync: false
      - key: PERSONAL_PASSWORD
        sync: false
      - key: SPAM_USER
        sync: false
      - key: SPAM_PASSWORD
        sync: false